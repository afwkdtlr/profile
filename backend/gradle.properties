# 시스템 JAVA_HOME(현재 다른 프로젝트용 JDK 8)은 변경하지 않습니다.
# Gradle만 아래 Java 17 JDK를 사용합니다. 경로를 바꾸려면 이 한 줄만 수정하세요.
# 슬래시(/)를 쓰면 Windows에서도 역슬래시 이스케이프가 필요 없습니다.
# 이 PC에서 확인된 다른 Java 17 경로 예시:
#   C:/Program Files/Java/jdk-17.0.0.1
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.18.8-hotspot
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8
